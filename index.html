  <script>
    // Tema diterapkan sebelum tampilan pertama agar tidak berkedip
    (function () { try {
      var P = 'kolej:v1:', pub = JSON.parse(localStorage.getItem(P + 'pub') || 'null'), m = JSON.parse(localStorage.getItem(P + 'mode') || 'null');
      if (!m) m = pub && pub.tema === 'Gelap' ? 'gelap' : pub && pub.tema === 'Sistem' ? 'sistem' : 'terang';
      var dark = m === 'gelap' || (m === 'sistem' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (pub && pub.warna) document.documentElement.style.setProperty('--brand', pub.warna);
      if (pub && pub.aksen) document.documentElement.style.setProperty('--accent-brand', pub.aksen);
    } catch (e) {} })();
  </script>
